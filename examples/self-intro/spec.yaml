body:
  columns:
    - - type: abstract
        text: >-
          amp turns a product or technology brief into a single A4 architecture page that builds itself in
          under three seconds, then keeps breathing with small, meaningful motion. A language model writes a
          compact `spec.yaml`; deterministic compilers own every coordinate, colour and keyframe. One source
          yields a live HTML page, a still poster and a HyperFrames MP4 -- and this page was produced by amp
          from amp's own spec.
      - type: section
        heading: I. Introduction
        text:
          - >-
            Architecture diagrams tend to fail in one of two ways: static and dense, or animated and vague.
            The explainers people actually share sit in between -- one page that ==builds in reading order==,
            then loops a short story while every frame stays readable.
          - >-
            amp packages that style as a reusable skill. The model decides *what* the system is: its tiers,
            its nodes, the one story worth telling. Code decides *where* and *when*.
      - type: cycle
        title: The Review Loop
        hue: purple
        center: ≈ 5 s / pass
        steps: [Build, Snapshot, Critique, Edit spec]
      - type: section
        level: 2
        heading: A. The Spec Is the Product
        text:
          - >-
            Everything on this page comes from `spec.yaml`: a header, a brand column, an archetype for the
            figure, three columns of blocks and an optional story. Nothing in it is a pixel; text budgets are
            checked at build time, so overflow is ==a build error, not a surprise==.
    - - type: section
        level: 2
        heading: B. Compilers, Not Prompts
        text:
          - >-
            Each archetype is a pure function from tiers to boxes, edges and packet routes. Themes are CSS
            tokens plus a hue palette. The motion compiler turns the layout into one paused GSAP timeline --
            the only clock the page has -- so any frame can be seeked, screenshotted or rendered exactly.
      - type: code
        title: spec.yaml (excerpt)
        hue: green
        text: |-
          figure:
            archetype: tiered
            tiers:
              - [director]
              - [researcher, writer, layout,
                 motion, artist, reviewer]
              - [spec, themes, archetypes,
                 timeline, outputs]
            feedback: { from: outputs }
      - type: section
        heading: II. The Motion Grammar
        text:
          - >-
            Motion has two phases. The **build** draws the page in data-flow order: header, root, buses,
            workers, substrate, results, then the feedback edge. The **ambient** phase is a heartbeat --
            the Director pulses, each worker swells as its packet lands, hand-offs flow into the
            substrate and results travel back up the dashed loop.
          - >-
            Idle effects stay small and seeded: edges march, mascots bob, ==highlights redraw==.
            Body text never moves.
      - type: table
        title: Table I. Motion inventory of this page
        columns: [Effect, Phase, Timing]
        rows:
          - [Build-in, build, "0 → 3.0 s, reading order"]
          - [Signal packets, story, 560 px/s along edges]
          - [Heartbeat, story, "1.2 s, two workers a beat"]
          - [Card breathing, story, +3.5% scale on arrival]
          - [Neon wordmark, idle, "glow breathes, seeded"]
          - [Mascot bob, idle, "1.9–2.8 s, seeded"]
    - - type: quote
        hue: magenta
        text: If a frame isn't a good poster, the motion is lying.
        by: "amp design rule #1"
      - type: section
        heading: III. The Review Loop
        text:
          - >-
            amp screenshots the page at named moments, tiles them into a contact sheet and emits a fit
            report: column fill, clipped titles, collisions. Critique is written against a rubric, applied to
            the spec, and the page rebuilds in about a second. Because every rubric item maps to a spec field,
            fixes stay declarative and the next pass is reproducible.
      - type: filmstrip
        frames:
          - { src: assets/filmstrip/f1.png, label: t = 0.9 s }
          - { src: assets/filmstrip/f2.png, label: t = 1.6 s }
          - { src: assets/filmstrip/f3.png, label: t = 3.2 s }
        caption: "**Fig. 2.** This page's own build-in, captured by the review loop."
      - type: section
        heading: IV. One Source, Three Outputs
        text:
          - >-
            The page is already a HyperFrames composition: a fixed duration, one registered timeline, local
            fonts and ==no wall-clock reads==. Rendering the MP4 is a single container run, done only after
            the HTML is approved. Published as one HTML file, the page centres and scales to any window.
      - type: takeaways
        title: Key Takeaways
        hue: blue
        items:
          - One spec, three outputs -- page, poster and MP4.
          - Layout and motion are compiled, never improvised.
          - After the build, every frame is a valid poster.
          - Review at the HTML stage; render video last.

